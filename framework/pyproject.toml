[project]
name = "fabricks"
version = "4.0.24"
description = ""
authors = [
    { name = "BMS DWH Team", email = "bi_support@bmsuisse.ch" },
]

# Attention: You may never specify newer dependencies than latests Databricks LTS Runtime
# Eg, PyYaml is at 6.0 there
requires-python = ">=3.11,<4"

dependencies = [
    "azure-data-tables >=12.5.0,<13",
    "azure-identity >=1.10.0",
    "azure-storage-blob >=12.14.1",
    "azure-storage-queue >=12.10.0,<13",
    "databricks-sdk >=0.20.0",
    "delta-spark>=4.4.0",
    "deptry>=0.23.1",
    # pyspark.sql.connect (imported unconditionally by fabricks/utils/_types.py
    # for the DataFrameLike/SparkSessionLike unions) requires these four at
    # import time regardless of environment - previously pulled in
    # transitively via databricks-connect before that moved to the opt-in
    # databricks-remote group (see below).
    "googleapis-common-protos>=1.56.4",
    "grpcio>=1.48.1",
    "grpcio-status>=1.48.1",
    "ipython>=8.18.1",
    "jinja2 >=2.11.3",
    "mermaid-magic>=0.1.4",
    "pandas>=2.2.3",
    "py4j>=0.10.9.7",
    "pyarrow>=15.0.0",
    "pydantic>=1.10.21",
    "pydantic-settings>=2.11.0",
    "pyspark>=3.5.7",
    "python-dotenv>=1.2.2",
    "pyyaml >=6.0.0",
    "sparkdantic>=1.5.0",
    "sqlglot>=29.0.1",
    "tenacity>=9.1.2",
    "tomli>=2.2.1;python_version<\"3.11\"",
    "tqdm>=4.67.1",
    "xxhash>=3.6.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
test = [
    "pytest >=7.1.2",
    "pytest-order >=1.0.1",
    "pytest-xdist >=3.6.1",
]
dev = [
    "autoflake >=2.3.1,<3",
    "basedpyright>=1.38.3",
    "deptry>=0.23.1",
    "isort >=5.13.2,<6",
    "notebook >=6.4.12",
    "pycln >=2.4.0,<3",
    "ruff >=0.4.3",
    "shandy-sqlfmt>=0.29.0",
    "yamlfix >=1.14.0",
    "ty>=0.0.29",
]
# databricks-connect patches pyspark's SparkSession in place (blocks plain
# local sessions unconditionally, regardless of JVM presence) - keep it out
# of the default install so `tests/spark/apache/`'s real Spark+Delta suite
# isn't corrupted by it. Only needed for FABRICKS_ENVIRONMENT=remote.
databricks-remote = [
    "databricks-cli>=0.18.0",
    "databricks-connect >=11.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.yamlfix]
line_length = 119

[tool.sqlfmt]
line_length = 119
exclude = [".venv"]

[tool.pycln]
all = false

[tool.autoflake]
remove-all-unused-imports = true
remove-duplicate-keys = true
remove-unused-variables = true
expand-star-imports = true
exclude = ["_init__.py"]

[tool.uv]
native-tls = true
keyring-provider = "subprocess"

[tool.hatch.build.targets.wheel]
packages = ["fabricks"]

[tool.ty.rules]
deprecated = "ignore"

[tool.ty.terminal]
output-format = "full"

[tool.deptry]
ignore = ["DEP003"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "mermaid-magic",
    "python-dotenv",
    "deptry",
    "databricks-cli",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
markers = [
    "plain: marks tests as pure-Python tests (no Spark/fabricks.context dependency)",
    "databricks: marks tests as Databricks-cluster integration tests (slower, needs a live cluster)",
    "apache: marks tests as Apache Spark CDC/DDL tests (real Spark+Delta, no Databricks Runtime)",
    "config: marks tests as config-resolution tests (real get_step/get_job, fake Spark, no container)",
]

[tool.fabricks]
runtime = "tests/spark/databricks/runtime"
notebooks = "fabricks/api/notebooks"
job_config_from_yaml = true
loglevel = "debug"
debugmode = true
config = "tests/spark/databricks/runtime/fabricks/conf.fabricks.yml"
devmode = true
