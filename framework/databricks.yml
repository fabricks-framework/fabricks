---
# These is the default bundle configuration if not otherwise overridden in
# the "targets" top-level mapping.
#
# targets (workspace hosts, service principal) live in databricks.targets.yml,
# gitignored -- not committed since they're environment-specific/sensitive.
include:
  - databricks.targets.yml
bundle:  # Required.
  name: fabricks_test
artifacts:
  fabricks_tool:
    build: uv build
    type: whl
variables:
  spark_version:
    default: 15.4.x-scala2.12
resources:
  jobs:
    fabricks_test_job:
      name: ${bundle.name}_${bundle.target}_pytest
      parameters:
        - name: schedule
          default: test
      tasks:
        - task_key: cluster
          notebook_task:
            notebook_path: fabricks/api/notebooks/cluster.py
          job_cluster_key: fabricks_test_cluster
          libraries:
            - whl: ./dist/*.whl
        - task_key: runtests
          depends_on:
            - task_key: cluster
          notebook_task:
            notebook_path: tests/spark/databricks/runtests.py
            source: WORKSPACE
          job_cluster_key: fabricks_test_cluster
      job_clusters:
        - job_cluster_key: fabricks_test_cluster
          new_cluster:
            cluster_name: ''
            spark_version: ${var.spark_version}
            azure_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK_AZURE
              spot_bid_max_price: -1
            node_type_id: Standard_D4ds_v4
            driver_node_type_id: Standard_D8ds_v4
            enable_elastic_disk: true
            init_scripts:
              - workspace:
                  destination: ${workspace.file_path}/tests/spark/databricks/init.sh
            data_security_mode: LEGACY_SINGLE_USER_STANDARD
            runtime_engine: PHOTON
            autoscale:
              min_workers: 1
              max_workers: 8
