---
# These is the default bundle configuration if not otherwise overridden in
# the "targets" top-level mapping.
#
# targets (workspace hosts, service principal) live in databricks.targets.yml,
# gitignored -- not committed since they're environment-specific/sensitive.
include:
  - databricks.targets.yml
bundle:  # Required.
  name: fabricks_test
artifacts:
  fabricks_tool:
    build: uv build
    type: whl
variables:
  spark_version:
    default: 18.x-scala2.13
  # Which runtime config the job runs against. Both live side by side in
  # tests/spark/databricks/runtime/fabricks/:
  #   conf.fabricks.yml     -- hive_metastore, per-layer abfss containers
  #   conf.uc.fabricks.yml  -- unity catalog bms_dna_test
  # UC is the default; override per deploy for the hive variant:
  #   databricks bundle deploy -t test --var="fabricks_conf=conf.fabricks.yml"
  fabricks_conf:
    default: conf.uc.fabricks.yml
resources:
  jobs:
    fabricks_test_job:
      name: ${bundle.name}_${bundle.target}_pytest
      parameters:
        - name: schedule
          default: test
      tasks:
        - task_key: cluster
          notebook_task:
            notebook_path: fabricks/api/notebooks/cluster.py
          job_cluster_key: fabricks_test_cluster
          libraries:
            - whl: ./dist/*.whl
        - task_key: runtests
          depends_on:
            - task_key: cluster
          notebook_task:
            notebook_path: tests/spark/databricks/runtests.py
            source: WORKSPACE
          job_cluster_key: fabricks_test_cluster
      job_clusters:
        - job_cluster_key: fabricks_test_cluster
          new_cluster:
            cluster_name: ''
            spark_version: ${var.spark_version}
            azure_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK_AZURE
              spot_bid_max_price: -1
            node_type_id: Standard_D8ads_v5
            driver_node_type_id: Standard_D8ds_v5
            kind: CLASSIC_PREVIEW
            enable_elastic_disk: true
            enable_local_disk_encryption: false
            autotermination_minutes: 60
            init_scripts:
              - workspace:
                  destination: ${workspace.file_path}/tests/spark/databricks/init.sh
            spark_env_vars:
              FABRICKS_ACCESS_KEY: '{{secrets/bmskv/bmsstatsteuwfabrickssnd-access-key}}'
              FABRICKS_ENCRYPTION_KEY: '{{secrets/bmskv/encryption-key}}'
              FABRICKS_CONFIG: ${workspace.file_path}/tests/spark/databricks/runtime/fabricks/${var.fabricks_conf}
            data_security_mode: USER_ISOLATION
            runtime_engine: PHOTON
            autoscale:
              min_workers: 1
              max_workers: 4
