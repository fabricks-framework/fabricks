---
# yaml-language-server: $schema=../../../../../../../../job-schema-gold.json
- job:
    step: gold
    topic: check
    item: fail
    tags: [test]
    options:
      mode: complete
    check_options:
      pre_run: true
- job:
    step: gold
    topic: check
    item: skip
    tags: [test]
    options:
      mode: complete
    check_options:
      skip: true
- job:
    step: gold
    topic: check
    item: max_rows
    tags: [test]
    options:
      mode: complete
    check_options:
      max_rows: 2
- job:
    step: gold
    topic: check
    item: duplicate_key
    tags: [test]
    options:
      mode: complete
- job:
    # Same check_options shape as check.fail -- pre_run: true reads
    # warning.pre_run.sql, whose __action is 'warning' instead of 'fail'.
    # fabricks/core/dags/run.py catches CheckWarning separately from a plain
    # Exception and logs 'warned' (not 'failed') -- the job's for_each_run()
    # still executes first (Processor.run() only raises the warning at the
    # very end), so the table is populated despite the warning.
    step: gold
    topic: check
    item: warning
    tags: [test]
    options:
      mode: complete
    check_options:
      pre_run: true
- job:
    # Job-level spark_options force JobResolver.spark (resolver.py) to
    # derive a session via _derive_session -- on this cluster's Spark
    # Connect session, newSession() isn't supported, so it falls back to
    # the parent session instead of crashing (issue  # 215). Uses a real
    # option (parquet compression codec, same as the apache tier's
    # semantic.fact.zstd) so the job also proves spark_options are
    # actually applied, not just that it didn't crash -- see
    # test_gold_check_zstd.
    step: gold
    topic: check
    item: zstd
    tags: [test]
    options:
      mode: complete
    spark_options:
      conf:
        spark.sql.parquet.compression.codec: zstd
