---
# yaml-language-server: $schema=../../../../../../../job-schema.json
- job:
    step: gold
    topic: check
    item: fail
    tags: [test]
    options:
      mode: complete
    check_options:
      pre_run: true
- job:
    step: gold
    topic: check
    item: skip
    tags: [test]
    options:
      mode: complete
    check_options:
      skip: true
- job:
    step: gold
    topic: check
    item: max_rows
    tags: [test]
    options:
      mode: complete
    check_options:
      max_rows: 2
- job:
    step: gold
    topic: check
    item: duplicate_key
    tags: [test]
    options:
      mode: complete
- job:
    # Same check_options shape as check.fail -- pre_run: true reads
    # warning.pre_run.sql, whose __action is 'warning' instead of 'fail'.
    # fabricks/core/dags/run.py catches CheckWarning separately from a plain
    # Exception and logs 'warned' (not 'failed') -- the job's for_each_run()
    # still executes first (Processor.run() only raises the warning at the
    # very end), so the table is populated despite the warning.
    step: gold
    topic: check
    item: warning
    tags: [test]
    options:
      mode: complete
    check_options:
      pre_run: true
