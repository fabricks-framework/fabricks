---
# yaml-language-server: $schema=../../../../../job-schema.json
# All three tagged jobs use register mode -- proves external-table
# registration (Bronze.create()/register(), bronze.py), each reading its own
# real Delta table under raw/delta/<topic>. king/queen are seeded per run by
# runtests.py's _seed_raw_delta_fixtures(); regent instead reads an
# already-real, standing external table on the storage account -- Unity
# Catalog binds a path to one table for good, so its data isn't
# re-seeded/re-registered on every run. Register mode never calls get_parser()
# (Bronze.parser asserts mode != "register"), so it can't prove the "dummy"
# custom parser plugin -- that's covered separately by the untagged
# feature/parser job below, invoked directly in test_feature.py instead of
# through the tag="test" schedule.
- job:
    step: bronze
    topic: king
    item: scd1
    tags: [test]
    options:
      mode: register
      uri: abfss://fabricks@$datahub/raw/delta/king
      keys: [id]
- job:
    step: bronze
    topic: regent
    item: scd1
    tags: [test]
    options:
      mode: register
      uri: abfss://fabricks@$datahub/raw/delta/regent
      keys: [id]
- job:
    step: bronze
    topic: queen
    item: scd1
    tags: [test]
    options:
      mode: register
      uri: abfss://fabricks@$datahub/raw/delta/queen
      keys: [id]
# Deliberately untagged (no `tags: [test]`): not part of the orchestration/DAG
# proof test_schedule.py exercises, so excluded from schedule(tag="test") and
# invoked directly (get_job(...).run()) in test_feature.py instead -- same
# pattern as gold/gold/feature/_config.feature.yml.
- job:
    step: bronze
    topic: feature
    item: parser
    options:
      mode: append
      uri: abfss://fabricks@$datahub/raw/king
      parser: dummy
      keys: [id]
      source: king
