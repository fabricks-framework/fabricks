---
# yaml-language-server: $schema=../../../../../job-schema.json
# One job per structurally distinct Bronze mode (fabricks/core/jobs/bronze.py) --
# each takes a different code path (parse/create/for_each_run), not just a
# different config value, so each needs its own job to be exercised at all.
#
# parser: json (not the repo's custom "monarch" parser) -- get_parser() maps
# built-in format names (json/parquet/avro/csv/tsv/delta/table) straight to
# plain BaseParser with zero custom logic (fabricks/core/parsers/
# get_parser.py:10-18), so this needs no delete-log handling at all. Bronze's
# `stream` is `mode not in ["register"]` (bronze.py:35-36), so both king
# (append) and queen (memory) are nominally "streaming" -- but memory mode's
# for_each_run() is a no-op (bronze.py, confirmed separately), so it never
# actually calls parse()/streams anything. king_scd1 below is therefore
# already the only job that genuinely exercises streaming -- one streaming
# option, not two.
- job:
    step: bronze
    topic: king
    item: scd1
    tags: [test]
    options:
      mode: append
      uri: abfss://fabricks@$datahub/raw/king
      parser: json
      keys: [id]
      source: king
- job:
    step: bronze
    topic: regent
    item: scd1
    tags: [test]
    options:
      mode: register
      uri: abfss://fabricks@$datahub/raw/delta/regent
      keys: [id]
- job:
    step: bronze
    topic: queen
    item: scd1
    tags: [test]
    options:
      mode: memory
      uri: abfss://fabricks@$datahub/raw/monarch
      parser: json
      keys: [id]
