# framework/tests/spark/apache/docker-compose.yml
services:
  apache-tests:
    build:
      context: ../../..
      dockerfile: tests/spark/apache/Dockerfile
    volumes:
      - ../../..:/workspace
      # ponytail: configure_spark_with_delta_pip() resolves Delta's JARs via
      # Ivy at runtime (see get_spark()'s docker branch). Without a persisted
      # cache, every `--rm` container re-fetches them from Maven from scratch.
      - apache-tests-ivy-cache:/root/.ivy2
    working_dir: /workspace

volumes:
  apache-tests-ivy-cache: {}
