# Ruff configuration for Fabricks
# Following Constitution: strict linting, explicit typing

# Vendored marketplace/plugin content, not code this team writes or owns --
# see docs/SKILLS.md for how .claude/skills/ gets synced.
# tests/unit/plain/fixtures/notebooks/: synthetic notebook fixtures read as raw text by
# fabricks.utils.notebook's parser under test -- deliberately contain undefined names
# (`spark`) and non-Python magic-cell syntax (`%sql`), not real code meant to run or lint.
extend-exclude = [".claude/skills", ".claude/worktrees", "tests/unit/plain/fixtures/notebooks"]

line-length = 119

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations (enforce type hints)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
    "D417", # pydocstyle: every parameter of a documented signature is described
    "TD003",  # flake8-todos: a TODO links its issue
    "PLR0915",  # pylint: no function with more than 100 statements (see [lint.pylint])
    "PLR0912",  # pylint: no function with more than 25 branches
    "PLR0913",  # pylint: no function with more than 12 arguments
    "C901",  # mccabe: no function with a complexity over 30
    "S110",  # bandit: no try/except/pass
    "S113",  # bandit: requests calls need a timeout
    "TRY002",  # tryceratops: raise a specific exception, not Exception
    "G004",  # flake8-logging-format: no f-strings in logging calls
    "RUF",  # Ruff-specific rules
]

ignore = [
    "B008",    # FastAPI Depends() in function defaults is intentional
]

[lint.per-file-ignores]
# ANN: no type hints in tests. ARG: pytest fixtures and monkeypatch lambdas
# take arguments they never read. ERA001: explanatory comments in tests quote
# code paths and read as commented-out code.
"tests/*" = ["ANN", "ARG", "ERA001"]

[lint.pydocstyle]
convention = "google"

[lint.mccabe]
max-complexity = 30

[lint.pylint]
max-statements = 100
max-branches = 25
max-args = 12

[lint.isort]
known-first-party = ["fabricks", "tests"]
force-sort-within-sections = true
split-on-trailing-comma=false
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = true

[lint.flake8-annotations]
allow-star-arg-any = false
suppress-none-returning = false
