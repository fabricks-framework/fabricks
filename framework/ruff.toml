# Ruff configuration for Fabricks
# Following Constitution: strict linting, explicit typing

# Vendored marketplace/plugin content, not code this team writes or owns --
# see docs/SKILLS.md for how .claude/skills/ gets synced.
extend-exclude = [".claude/skills", ".claude/worktrees"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations (enforce type hints)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
    "RUF",  # Ruff-specific rules
]

ignore = [
    "ANN101",  # Missing type annotation for self
    "ANN102",  # Missing type annotation for cls
    "B008",    # FastAPI Depends() in function defaults is intentional
]

[lint.per-file-ignores]
"tests/*" = ["ANN"]  # Don't require type hints in tests

[lint.isort]
known-first-party = ["app"]
force-sort-within-sections = true
split-on-trailing-comma=false
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = true

[lint.flake8-annotations]
allow-star-arg-any = false
suppress-none-returning = false
