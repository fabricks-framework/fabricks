name: Python Test

on:
  push:
    branches: ["main"]
    paths-ignore: ["**.md", "docs/**", "skills/**", ".claude/**", ".vscode/**", ".github/**", "framework/skills.json", "LICENSE"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["**.md", "docs/**", "skills/**", ".claude/**", ".vscode/**", ".github/**", "framework/skills.json", "LICENSE"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: databricks/setup-cli@main
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        run: uv sync --all-extras --group test --group dev
        working-directory: framework
      
      - name: Install just
        uses: extractions/setup-just@v2

      # The recipes in framework/justfile are the single definition of each tier command (see docs/TEST.md).
      - name: Lint (ruff + ty on fabricks and tests)
        run: just lint
        working-directory: framework

      # One tier per pytest process: each tier's conftest.py patches
      # sys.modules at import time, so `pytest tests/unit` would let whichever
      # conftest imports first win for the rest of the run -- see docs/TEST.md.
      # `just test-unit` runs plain then config as separate processes.
      - name: Run Unit Tests (plain, then config)
        run: just test-unit
        working-directory: framework
        env:
          FABRICKS_TEST_LOG: "off"
          PYTEST_ADDOPTS: "--maxfail 3"

  apache:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SPARK_LOCAL_IP: 127.0.0.1

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-java-17-uv-${{ hashFiles('framework/uv.lock') }}
          restore-keys: ${{ runner.os }}-java-17-uv-
      - name: Cache Ivy
        uses: actions/cache@v4
        with:
          path: ~/.ivy2.5.2
          key: ${{ runner.os }}-java-17-ivy-${{ hashFiles('framework/uv.lock') }}
          restore-keys: ${{ runner.os }}-java-17-ivy-
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked --group test --group dev
        working-directory: framework
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Run Apache Spark Tests
        timeout-minutes: 22
        working-directory: framework
        env:
          PYTEST_ADDOPTS: "-ra --tb=long --junitxml=artifacts/apache.xml"
        run: |
          mkdir -p artifacts
          just test-apache tests/spark/apache 3
      - name: Upload Apache failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apache-test-diagnostics
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            framework/artifacts/apache.xml
            framework/.logs/apache/
