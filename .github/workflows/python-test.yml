name: Python Test

on:
  push:
    branches: ["main"]
    paths-ignore: ["README.md", "docs", ".github"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["README.md", "docs", ".github"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: databricks/setup-cli@main
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        run: uv sync --all-extras --group test --group dev
        working-directory: framework
      
      - name: Ty
        run: uv run ty check fabricks
        working-directory: framework

      # One tier per pytest process: each tier's conftest.py patches
      # sys.modules at import time, so `pytest tests/unit` would let whichever
      # conftest imports first win for the rest of the run -- see docs/TEST.md.
      - name: Run Plain Unit Tests
        run: uv run pytest tests/unit/plain --maxfail 3
        working-directory: framework

      - name: Run Config Unit Tests
        run: uv run pytest tests/unit/config --maxfail 3
        working-directory: framework

  apache:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SPARK_LOCAL_IP: 127.0.0.1

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-java-17-uv-${{ hashFiles('framework/uv.lock') }}
          restore-keys: ${{ runner.os }}-java-17-uv-
      - name: Cache Ivy
        uses: actions/cache@v4
        with:
          path: ~/.ivy2.5.2
          key: ${{ runner.os }}-java-17-ivy-${{ hashFiles('framework/uv.lock') }}
          restore-keys: ${{ runner.os }}-java-17-ivy-
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked --group test --group dev
        working-directory: framework
      - name: Run Apache Spark Tests
        timeout-minutes: 22
        working-directory: framework
        run: |
          mkdir -p artifacts
          set -o pipefail
          uv run pytest tests/spark/apache -v -ra --tb=long \
            --junitxml=artifacts/apache.xml 2>&1 | tee artifacts/apache.log
      - name: Upload Apache failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apache-test-diagnostics
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            framework/artifacts/apache.xml
            framework/artifacts/apache.log
            framework/tests/spark/apache/.worker_cwd/**/derby.log
            framework/**/hs_err_pid*.log
            /tmp/hs_err_pid*.log
